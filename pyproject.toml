[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pebble-legacy-tools"
version = "0.2.0"
description = "Build, test, install and measure a PebbleOS port for the Pebble Time family"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
# Everything that talks to a watch: the developer connection and the recovery install.
watch = ["libpebble2>=0.0.16", "pypng", "websocket-client"]
# The emulator launchers when they run outside the build container.
emulator = ["intelhex>=2.1,<3"]
# Disassembly around return addresses in a core dump.
coredump = ["capstone"]
dev = ["build", "pytest", "ruff==0.17.5"]

[project.scripts]
plt = "plt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plt = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
